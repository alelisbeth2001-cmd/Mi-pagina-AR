<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --morado-noche: #1e1033;
            --morado-profundo: #3b1a6b;
            --morado-principal: #6d3fc4;
            --morado-claro: #b79cf0;
            --lavanda: #f4effc;
        }

        body {
            background-color: var(--lavanda);
        }

        /* Navbar */
        .navbar-morado {
            background: linear-gradient(90deg, var(--morado-noche), var(--morado-profundo));
        }
        .navbar-morado .nav-link {
            color: var(--morado-claro);
            border-radius: .5rem;
            padding: .5rem .9rem;
            transition: background-color .2s, color .2s;
        }
        .navbar-morado .nav-link:hover,
        .navbar-morado .nav-link:focus-visible {
            color: #fff;
            background-color: rgba(183, 156, 240, .2);
        }
        .navbar-morado .nav-link.active {
            color: #fff;
            background-color: var(--morado-principal);
        }
        .navbar-morado .nav-link.disabled {
            color: rgba(183, 156, 240, .4);
        }
        .navbar-morado .navbar-toggler {
            border-color: var(--morado-claro);
        }

        /* Líneas separadoras */
        hr {
            border-color: var(--morado-principal);
            opacity: .6;
        }

        /* Video */
        .marco-video {
            border: 4px solid var(--morado-principal);
            border-radius: 1rem;
            box-shadow: 0 12px 30px rgba(109, 63, 196, .35);
            overflow: hidden;
            background: var(--morado-noche);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-sm navbar-dark navbar-morado">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false"
                    aria-label="Mostrar u ocultar el menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Columnas.html">Columnas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tarjetas.html">Tarjetas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <hr>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="ratio ratio-16x9 marco-video">
                    <iframe
                        src="https://www.youtube.com/embed/fLexgOxsZu0?si=luquR1vqNMEA-Xtf"
                        title="YouTube video player"
                        loading="lazy"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <hr>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
